# TEMPORARY. Validates the russh port of services/sftp on Linux, macOS, and
# Windows. Upstream behavior tests need 1Password-backed credentials, so this
# stands up its own OpenSSH server on each runner instead. Delete before merge.

name: tmp sftp cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - ci/sftp-crossplatform

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint, unit tests, and doc tests. Proves the crate compiles on Windows,
  # which the openssh-based implementation could not do at all.
  check:
    name: check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build
        working-directory: core
        run: cargo build -p opendal-service-sftp --locked

      - name: Clippy
        working-directory: core
        run: cargo clippy -p opendal-service-sftp --all-targets --locked -- -D warnings

      - name: Rustfmt
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Unit tests
        working-directory: core
        run: cargo test -p opendal-service-sftp --lib --locked

      - name: Doc tests
        working-directory: core
        run: cargo test -p opendal-service-sftp --doc --locked

  # Full 118-case behavior suite against a real OpenSSH server.
  #
  # Paths stay relative to the login directory (no OPENDAL_SFTP_ROOT) so the
  # same configuration works on all three platforms; Windows OpenSSH exposes
  # drive-qualified roots like /C:/Users/runneradmin, which an absolute root
  # would have to special-case.
  behavior:
    name: behavior / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      # Keys and sshd_config are generated in bash on every platform, including
      # Windows via Git Bash, so quoting rules stay uniform.
      - name: Generate keys and sshd_config
        shell: bash
        run: |
          set -euo pipefail
          SFTP_DIR="$HOME/sftp-ci"
          rm -rf "$SFTP_DIR"
          mkdir -p "$SFTP_DIR"

          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq openssh-server
          fi

          ssh-keygen -q -t ed25519 -f "$SFTP_DIR/host_key" -N ''
          ssh-keygen -q -t ed25519 -f "$SFTP_DIR/client_key" -N ''
          cp "$SFTP_DIR/client_key.pub" "$SFTP_DIR/authorized_keys"
          chmod 600 "$SFTP_DIR/authorized_keys" "$SFTP_DIR/client_key" "$SFTP_DIR/host_key"

          if [ "$RUNNER_OS" = "Windows" ]; then
            # Must be the Windows OpenSSH sftp-server. Git Bash also ships one
            # under "C:/Program Files/Git", and that path contains a space that
            # the Subsystem directive cannot parse.
            echo "--- C:/Windows/System32/OpenSSH ---"
            ls -la "/c/Windows/System32/OpenSSH/" || true
            SFTP_SERVER="/c/Windows/System32/OpenSSH/sftp-server.exe"
            CFG_DIR=$(cygpath -m "$SFTP_DIR")
            EXTRA=""
          else
            # Locate sftp-server without `ls`, whose non-zero exit on a missing
            # path trips `set -e` under `pipefail`.
            SFTP_SERVER=""
            for candidate in \
              /usr/lib/openssh/sftp-server \
              /usr/libexec/openssh/sftp-server \
              /usr/libexec/sftp-server \
              /usr/lib/ssh/sftp-server
            do
              if [ -x "$candidate" ]; then
                SFTP_SERVER="$candidate"
                break
              fi
            done
            CFG_DIR="$SFTP_DIR"
            EXTRA="UsePAM no"
          fi

          if [ ! -x "$SFTP_SERVER" ]; then
            echo "could not locate sftp-server at: $SFTP_SERVER"
            exit 1
          fi
          echo "using sftp-server: $SFTP_SERVER"

          if [ "$RUNNER_OS" = "Windows" ]; then
            SFTP_SERVER=$(cygpath -m "$SFTP_SERVER")
          fi

          # UseDNS triggers a reverse lookup per connection, which adds seconds
          # per handshake on the hosted runners. MaxStartups is raised so the
          # pool can warm up without the server dropping handshakes.
          cat > "$SFTP_DIR/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $CFG_DIR/host_key
          AuthorizedKeysFile $CFG_DIR/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          StrictModes no
          UseDNS no
          GSSAPIAuthentication no
          MaxStartups 100:30:200
          MaxSessions 100
          PidFile $CFG_DIR/sshd.pid
          LogLevel VERBOSE
          $EXTRA
          Subsystem sftp "$SFTP_SERVER"
          EOF

          echo "--- sshd_config ---"
          cat "$SFTP_DIR/sshd_config"
          echo "--- key files ---"
          ls -la "$SFTP_DIR"
          test -s "$SFTP_DIR/host_key" || { echo "host key was not generated"; exit 1; }

          # Give the suite a dedicated root. Without one the tests operate on
          # the runner's home directory, and the recursive listing cases walk
          # the whole cargo registry, which is what pushed macOS past the
          # harness timeout.
          mkdir -p "$HOME/sftp-root"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows OpenSSH exposes drive-qualified paths as /C:/...
            SFTP_ROOT="/$(cygpath -m "$HOME/sftp-root")/"
          else
            SFTP_ROOT="$HOME/sftp-root/"
          fi
          echo "using root: $SFTP_ROOT"

          echo "OPENDAL_SFTP_KEY=$SFTP_DIR/client_key" >> "$GITHUB_ENV"
          echo "OPENDAL_SFTP_ROOT=$SFTP_ROOT" >> "$GITHUB_ENV"
          echo "SFTP_CI_DIR=$SFTP_DIR" >> "$GITHUB_ENV"

      - name: Start sshd (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Unprivileged: sshd only ever authenticates the runner user.
          "$(command -v sshd || echo /usr/sbin/sshd)" \
            -f "$SFTP_CI_DIR/sshd_config" -E "$SFTP_CI_DIR/sshd.log"
          echo "OPENDAL_SFTP_USER=$(whoami)" >> "$GITHUB_ENV"

      # Run sshd as the Windows service rather than a child process: a process
      # started from a step is torn down when that step's shell exits, which
      # left the port closed by the time the next step ran.
      - name: Start sshd (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SftpDir = (Join-Path $env:USERPROFILE 'sftp-ci').Replace('\', '/')

          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          Stop-Service sshd -ErrorAction SilentlyContinue

          # Host keys for the service live in ProgramData.
          ssh-keygen -A

          $SftpServer = 'C:/Windows/System32/OpenSSH/sftp-server.exe'
          @"
          Port 2222
          ListenAddress 127.0.0.1
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          StrictModes no
          UseDNS no
          GSSAPIAuthentication no
          MaxStartups 100:30:200
          MaxSessions 100
          LogLevel VERBOSE
          AuthorizedKeysFile $SftpDir/authorized_keys
          Subsystem sftp "$SftpServer"
          "@ | Set-Content -Path 'C:\ProgramData\ssh\sshd_config' -Encoding ascii

          Write-Host '--- sshd_config ---'
          Get-Content 'C:\ProgramData\ssh\sshd_config'

          # The default config restricts administrators to a shared key file;
          # this run authenticates through AuthorizedKeysFile instead.
          icacls "$SftpDir/authorized_keys" /inheritance:r /grant:r "$($env:USERNAME):(F)" /grant:r "SYSTEM:(F)" /grant:r "Administrators:(F)"

          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          (Get-Service sshd).Status

          "OPENDAL_SFTP_USER=$env:USERNAME" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Git Bash builds bash without net redirections, so /dev/tcp silently
      # fails on Windows even when sshd is listening.
      - name: Wait for sshd (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222' 2>/dev/null; then
              echo "sshd is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "sshd did not come up"
          exit 1

      - name: Wait for sshd (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              $c.Connect('127.0.0.1', 2222)
              if ($c.Connected) {
                Write-Host 'sshd is accepting connections'
                $c.Close()
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 1
            } finally {
              $c.Dispose()
            }
          }
          Write-Host 'sshd did not come up'
          exit 1

      - name: Behavior tests
        working-directory: core
        shell: bash
        env:
          OPENDAL_TEST: sftp
          OPENDAL_SFTP_ENDPOINT: ssh://127.0.0.1:2222
          OPENDAL_SFTP_KNOWN_HOSTS_STRATEGY: accept
        run: |
          # Each test builds its own operator and therefore its own connection
          # pool. Hosted macOS runners fork processes slowly enough that a full
          # parallel run pushes individual operations past the harness timeout,
          # so cap the concurrency there.
          if [ "$RUNNER_OS" = "macOS" ]; then
            THREADS=4
          else
            THREADS=8
          fi
          cargo test behavior --features tests,services-sftp --locked -- --test-threads="$THREADS"

      - name: sshd log on failure
        if: failure()
        shell: bash
        run: |
          echo "--- sshd.log ---"
          cat "$HOME/sftp-ci/sshd.log" 2>/dev/null || echo "(no log)"
          echo "--- dir ---"
          ls -la "$HOME/sftp-ci" 2>/dev/null || true

  # Mirrors the upstream Linux setup: dockerised atmoz/sftp with an absolute
  # OPENDAL_SFTP_ROOT, covering the rooted path handling the matrix above skips.
  behavior-rooted-linux:
    name: behavior / rooted (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Start SFTP
        working-directory: fixtures/sftp
        run: docker compose -f docker-compose-sftp.yml up -d --wait

      - name: Behavior tests
        working-directory: core
        env:
          OPENDAL_TEST: sftp
          OPENDAL_SFTP_ENDPOINT: ssh://127.0.0.1:2222
          OPENDAL_SFTP_ROOT: /upload/sftp_test/
          OPENDAL_SFTP_USER: foo
          OPENDAL_SFTP_KNOWN_HOSTS_STRATEGY: accept
        run: |
          chmod 600 "$GITHUB_WORKSPACE/fixtures/sftp/test_ssh_key"
          export OPENDAL_SFTP_KEY="$GITHUB_WORKSPACE/fixtures/sftp/test_ssh_key"
          cargo test behavior --features tests,services-sftp --locked

  # Guards the known_hosts logic that replaced ssh's own implementation.
  # Upstream CI only ever exercises `accept`.
  known-hosts:
    name: known_hosts strategies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Start SFTP
        working-directory: fixtures/sftp
        run: docker compose -f docker-compose-sftp.yml up -d --wait

      - name: strict rejects, add records, strict then accepts
        working-directory: core
        run: |
          set -euxo pipefail
          chmod 600 "$GITHUB_WORKSPACE/fixtures/sftp/test_ssh_key"

          cargo build --tests --features tests,services-sftp --locked
          BIN=$(ls -t target/debug/deps/behavior-* | grep -v '\.d$' | head -1)

          FAKE_HOME=$(mktemp -d)
          run_case() {
            HOME="$FAKE_HOME" \
            OPENDAL_TEST=sftp \
            OPENDAL_SFTP_ENDPOINT=ssh://127.0.0.1:2222 \
            OPENDAL_SFTP_ROOT=/upload/sftp_test/ \
            OPENDAL_SFTP_USER=foo \
            OPENDAL_SFTP_KEY="$GITHUB_WORKSPACE/fixtures/sftp/test_ssh_key" \
            OPENDAL_SFTP_KNOWN_HOSTS_STRATEGY="$1" \
            "$BIN" test_stat_file --test-threads=1
          }

          echo "--- strict must fail against an empty known_hosts ---"
          if run_case strict; then
            echo "strict accepted an unknown host key"
            exit 1
          fi

          echo "--- add must succeed and record the key ---"
          run_case add
          grep -q '127.0.0.1' "$FAKE_HOME/.ssh/known_hosts"

          echo "--- strict must now succeed ---"
          run_case strict
